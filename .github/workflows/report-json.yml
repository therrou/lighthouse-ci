name: Accessibility Testing with JSON Reporter

on: [pull_request]

jobs:
  a11y-testing:
    name: Accessibility Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Add timeout to prevent hanging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better reporting

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specify Node.js version
          cache: 'npm'  # Enable npm caching

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci
        
      - name: Build Astro Project
        run: npm run build
        env:
          NODE_ENV: production
        
      - name: Start Astro preview server
        run: |
          npm run preview -- --port 4321 &
          echo $! > ./server.pid

      - name: Wait for server
        timeout-minutes: 1
        run: |
          while ! nc -z localhost 4321; do
            echo "Waiting for server..."
            sleep 2
            if ! ps -p $(cat ./server.pid) > /dev/null; then
              echo "Server failed to start"
              exit 1
            fi
          done
          echo "Server is up!"

      - name: Install Playwright
        run: |
          npx playwright install --with-deps chromium
          npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
        continue-on-error: true  # Continue even if tests fail

      - name: Run CTRF annotations
        if: always()  # Run even if previous steps fail
        run: npx github-actions-ctrf ctrf/ctrf-report.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-report
          path: |
            ctrf/ctrf-report.json
            playwright-report/
          retention-days: 30

      - name: Stop preview server
        if: always()
        run: kill $(cat ./server.pid) || true

      - name: Check for test failures
        if: failure()
        run: |
          echo "::error::Accessibility tests failed. Please check the report artifacts."
          exit 1